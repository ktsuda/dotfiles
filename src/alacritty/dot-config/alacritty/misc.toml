[env]
TERM = "xterm-256color"

[scrolling]
history = 5000

[mouse]
hide_when_typing = true

[colors]
transparent_background_colors = true

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/bin/sh"
args = ["-c", "exec ~/.local/share/herdr/session-loop.sh default"]

